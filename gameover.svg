<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <rect width="800" height="220" fill="#0a0a0f"/>

  <text x="400" y="120" text-anchor="middle"
        font-family="Courier New, monospace" font-weight="bold"
        fill="#dc2828" opacity="0">
    GAME OVER
    <animate attributeName="opacity" from="0" to="1" dur="2s" fill="freeze"/>
    <animate attributeName="font-size" from="40" to="90" dur="2s" fill="freeze"/>
  </text>

  <text x="400" y="180" text-anchor="middle"
        font-family="Courier New, monospace" font-size="22"
        fill="#cccccc" opacity="0">
    Pressione qualquer tecla para recomeçar
    <animate attributeName="opacity" values="0;1;0" dur="1.5s"
             begin="2s" repeatCount="indefinite"/>
  </text>
</svg>